<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>The Orrery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#e8f1f8;
  --dim:rgba(210,228,242,.55);
  --faint:rgba(210,228,242,.22);
  --line:rgba(190,220,245,.22);
  --glass:rgba(10,22,38,.44);
  --gold:#ffd9a0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#02040a;color:var(--ink);
  font-family:'Nunito Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.dragging{cursor:grabbing}

#title{position:fixed;left:clamp(16px,3vw,46px);top:clamp(14px,2.8vh,38px);z-index:5;pointer-events:none;
  transition:opacity .5s ease,transform .5s ease}
#title h1{font-family:'Fraunces',serif;font-weight:300;font-size:clamp(30px,4.4vw,62px);
  letter-spacing:-.02em;line-height:.94;margin:0;
  background:linear-gradient(180deg,#fff 0%,#ffe9c8 55%,#ffc879 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#title p{margin:.85em 0 0;font-size:clamp(9px,1vw,12px);letter-spacing:.28em;text-transform:uppercase;
  font-weight:700;color:var(--dim)}

#toggles{position:fixed;right:clamp(12px,2.3vw,32px);top:clamp(12px,2.4vh,28px);z-index:7;
  display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end;max-width:min(560px,56vw)}
.pill{font:600 12px/1 'Nunito Sans',sans-serif;letter-spacing:.05em;color:#dcecf8;
  background:rgba(8,20,34,.55);border:1px solid rgba(180,215,245,.26);padding:9px 14px;border-radius:999px;
  cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:background .2s,color .2s,border-color .2s,transform .15s;white-space:nowrap;user-select:none}
.pill:hover{background:rgba(150,200,240,.16);border-color:rgba(200,230,255,.5)}
.pill:active{transform:scale(.97)}
.pill.on{background:rgba(255,235,205,.92);color:#1a1208;border-color:#fff2da}

#bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:clamp(12px,2.4vh,26px);
  width:min(880px,calc(100vw - 28px));z-index:6;display:flex;flex-direction:column;gap:10px;
  transition:opacity .5s ease,transform .5s ease}
#dateRow{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  font-variant-numeric:tabular-nums}
#date{font-family:'Fraunces',serif;font-size:clamp(20px,2.6vw,30px);letter-spacing:.01em;color:#fff;
  text-shadow:0 0 24px rgba(160,210,255,.35)}
#rate{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
#track{position:relative;height:26px;display:flex;align-items:center}
#rail{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--line) 12%,var(--line) 88%,transparent)}
#railFill{position:absolute;left:0;height:1px;background:linear-gradient(90deg,rgba(255,220,170,.2),rgba(255,220,170,.9));box-shadow:0 0 12px rgba(255,210,150,.5)}
#scrub{position:relative;width:100%;height:26px;-webkit-appearance:none;appearance:none;background:transparent;margin:0;cursor:pointer}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:#fff6e4;border:1px solid rgba(255,220,170,.9);box-shadow:0 0 14px rgba(255,215,160,.9),0 0 2px #fff}
#scrub::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff6e4;border:1px solid #ffdcae;
  box-shadow:0 0 14px rgba(255,215,160,.9)}
#presets{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.preset{font:600 10.5px/1 'Nunito Sans',sans-serif;letter-spacing:.08em;color:var(--dim);
  background:transparent;border:1px solid rgba(180,215,245,.18);padding:6px 11px;border-radius:999px;cursor:pointer;
  transition:all .18s;text-transform:uppercase}
.preset:hover{color:#fff;border-color:rgba(200,230,255,.45)}
.preset.on{color:#1a1208;background:rgba(255,235,205,.92);border-color:#fff2da}

#info{position:fixed;right:clamp(12px,2.3vw,32px);top:50%;transform:translate(18px,-50%);
  width:min(288px,calc(100vw - 32px));z-index:6;padding:20px 20px 18px;border-radius:18px;
  background:linear-gradient(180deg,rgba(14,28,46,.82),rgba(8,16,28,.88));
  border:1px solid rgba(180,215,245,.20);backdrop-filter:blur(20px) saturate(130%);
  -webkit-backdrop-filter:blur(20px) saturate(130%);
  box-shadow:0 30px 70px -30px rgba(0,0,0,.9);
  opacity:0;pointer-events:none;transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.3,1)}
#info.show{opacity:1;transform:translate(0,-50%);pointer-events:auto}
#info .nm{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:0 0 2px}
#info .ty{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:14px}
#info .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid rgba(180,215,245,.10);font-size:12.5px}
#info .row span:first-child{color:var(--dim)}
#info .row span:last-child{font-variant-numeric:tabular-nums;color:#fff}
#info .fact{margin-top:14px;font-size:11.5px;line-height:1.5;color:rgba(220,238,250,.72);font-style:italic}
#info .close{position:absolute;right:12px;top:12px;width:24px;height:24px;border-radius:50%;
  border:1px solid rgba(180,215,245,.2);background:transparent;color:var(--dim);cursor:pointer;font-size:13px;line-height:1}
#info .close:hover{color:#fff;border-color:rgba(200,230,255,.5)}

#labels{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:rgba(220,238,250,.72);
  text-shadow:0 0 10px rgba(0,0,0,.9);white-space:nowrap;transition:color .2s,opacity .3s}
.lbl:hover{color:#fff}
.lbl .dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:currentColor;
  margin-right:6px;vertical-align:middle;opacity:.8}
.lbl::before{content:'';position:absolute;left:50%;bottom:calc(100% + 2px);width:1px;
  height:var(--lead,0px);transform:translateX(-0.5px);
  background:linear-gradient(to top,rgba(200,225,245,.26),rgba(200,225,245,.03))}
.lbl.focus{color:#ffe2b0}

#note{position:fixed;left:50%;transform:translateX(-50%);bottom:clamp(120px,17vh,180px);
  max-width:min(560px,84vw);text-align:center;font-size:11.5px;line-height:1.6;letter-spacing:.04em;
  color:rgba(230,244,255,.72);z-index:5;opacity:0;transition:opacity .8s ease;pointer-events:none}
#note.show{opacity:1}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(clamp(12px,2.4vh,26px) + 96px);
  font-size:10.5px;letter-spacing:.1em;color:rgba(220,238,250,.5);z-index:5;pointer-events:none;
  opacity:0;transition:opacity 1s}
#hint.show{opacity:1}
#showui{position:fixed;right:clamp(12px,2.3vw,30px);bottom:clamp(12px,2.4vh,26px);width:40px;height:40px;
  border-radius:50%;border:1px solid rgba(180,215,245,.3);background:rgba(8,20,34,.5);color:#dcecf8;
  display:none;place-items:center;cursor:pointer;z-index:8;backdrop-filter:blur(14px);font-size:15px}
body.ui-hidden #title,body.ui-hidden #toggles,body.ui-hidden #bottom,body.ui-hidden #info,body.ui-hidden #labels,body.ui-hidden #hint{opacity:0;pointer-events:none}
body.ui-hidden #showui{display:grid}
#err{position:fixed;left:8px;top:8px;z-index:99;max-width:80vw;max-height:70vh;overflow:auto;
  background:rgba(120,0,20,.9);color:#fff;font:11px/1.45 ui-monospace,Menlo,monospace;padding:10px 12px;
  border-radius:10px;white-space:pre-wrap;display:none}

@media (max-width:760px){
  #title{left:13px;top:11px;max-width:calc(100vw - 26px)}
  #title h1{font-size:clamp(24px,7.6vw,34px)}
  #title p{display:none}
  #toggles{max-width:none;left:8px;right:8px;justify-content:flex-start;gap:5px;top:50px}
  .pill{padding:6px 9px;font-size:9.5px;letter-spacing:.03em}
  #bottom{bottom:8px;width:calc(100vw - 16px);gap:6px}
  #date{font-size:20px}
  #info{left:8px;right:8px;width:auto;top:auto;bottom:152px;transform:translateY(18px);
    padding:14px 15px 12px;max-height:46vh;overflow:auto;border-radius:15px}
  #info.show{transform:translateY(0)}
  #info .nm{font-size:21px}
  #info .ty{font-size:8.5px;margin-bottom:9px}
  #info .row{font-size:11px;padding:4.5px 0}
  #info .fact{font-size:10px;margin-top:10px}
  #note{bottom:150px;font-size:10.5px;left:14px;right:14px;transform:none;max-width:none}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>

<div id="title">
  <h1>The Orrery</h1>
  <p>the solar system, on your time</p>
</div>

<div id="toggles">
  <button class="pill" id="btnScale">True scale</button>
  <button class="pill on" id="btnOrbits">Orbits</button>
  <button class="pill on" id="btnLabels">Labels</button>
  <button class="pill on" id="btnSound">Sound</button>
  <button class="pill" id="btnHide">Hide UI</button>
</div>

<div id="bottom">
  <div id="dateRow"><div id="date">2000-01-01</div><div id="rate">1 day / sec</div></div>
  <div id="track">
    <div id="rail"></div><div id="railFill"></div>
    <input id="scrub" type="range" min="0" max="1" step="0.0005" value="0.5">
  </div>
  <div id="presets">
    <button class="preset" data-rate="0.000694">1 hour / s</button>
    <button class="preset on" data-rate="1">1 day / s</button>
    <button class="preset" data-rate="30.4375">1 month / s</button>
    <button class="preset" data-rate="365.25">1 year / s</button>
    <button class="preset" id="btnNow">Now</button>
  </div>
</div>

<div id="info">
  <button class="close" id="infoClose">×</button>
  <div class="nm" id="infoName">Earth</div>
  <div class="ty" id="infoType">Terrestrial planet</div>
  <div id="infoRows"></div>
  <div class="fact" id="infoFact"></div>
</div>

<div id="note"></div>
<div id="hint">drag to orbit · scroll to zoom · click a planet</div>
<button id="showui" title="Show UI (H)">&#9673;</button>
<pre id="err"></pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if (!window.THREE) { document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>'); }</script>
<script>

/* =====================================================================
   THE ORRERY — a solar system you can dial to any date
   Three.js r128 · procedural planets · real Keplerian elements
   ===================================================================== */
(function () {
'use strict';

var THREE = window.THREE;
function fatal(msg) {
  var el = document.getElementById('err');
  if (el) { el.style.display = 'block'; el.textContent += msg + '\n'; }
}
if (!THREE) { fatal('three.js failed to load'); return; }
window.addEventListener('error', function (e) {
  fatal('ERROR: ' + (e.message || e.error) + ' @' + (e.filename || '') + ':' + (e.lineno || 0));
});
window.addEventListener('unhandledrejection', function (e) {
  fatal('REJECT: ' + (e.reason && e.reason.stack || e.reason));
});

var DEG = Math.PI / 180;
var TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smoothstep(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function damp(cur, target, lambda, dt) { return lerp(cur, target, 1 - Math.exp(-lambda * dt)); }
function wrapAngle(a) { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }

/* ------------------------------------------------------------------ *
 *  world constants
 * ------------------------------------------------------------------ */
var AU = 9.0;                 /* world units per AU at true scale        */
var DISP_POW = 0.36;          /* radial compression of the display scale */
var J2000 = 2451545.0;        /* Julian date of the epoch                */
var DAY_MS = 86400000;

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(45, 1, 0.02, 9000);
var canvas = document.getElementById('gl');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setClearColor(0x02040a, 1);

var sunLight = new THREE.PointLight(0xfff2dc, 2.4, 0, 0);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x1a2438, 0.55));

/* ------------------------------------------------------------------ *
 *  camera rig
 * ------------------------------------------------------------------ */
var cam = {
  yaw: 0.78, pitch: 0.50, dist: 58,
  tgt: new THREE.Vector3(), tTgt: new THREE.Vector3(),
  tDist: 58, focus: null, autoSpin: true, spin: 0
};

function updateCamera(dt) {
  cam.tgt.lerp(cam.tTgt, 1 - Math.exp(-7 * dt));
  cam.dist = damp(cam.dist, cam.tDist, 5, dt);
  if (cam.autoSpin) cam.yaw += dt * 0.035;
  var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  camera.position.set(
    cam.tgt.x + Math.sin(cam.yaw) * cp * cam.dist,
    cam.tgt.y + sp * cam.dist,
    cam.tgt.z + Math.cos(cam.yaw) * cp * cam.dist
  );
  camera.lookAt(cam.tgt);
}

/* ------------------------------------------------------------------ *
 *  star field
 * ------------------------------------------------------------------ */
(function stars() {
  var N = 9000;
  var pos = new Float32Array(N * 3);
  var col = new Float32Array(N * 3);
  var siz = new Float32Array(N);
  var c = new THREE.Color();
  for (var i = 0; i < N; i++) {
    /* bias a third of the stars toward the galactic band */
    var u = Math.random(), v = Math.random();
    var theta = u * TAU;
    var phi, band = (i % 3 === 0);
    if (band) {
      phi = Math.PI * 0.5 + (Math.random() - 0.5) * 0.55;
    } else {
      phi = Math.acos(2 * v - 1);
    }
    var r = 2400;
    var x = r * Math.sin(phi) * Math.cos(theta);
    var y = r * Math.cos(phi);
    var z = r * Math.sin(phi) * Math.sin(theta);
    /* tilt the band */
    var ca = Math.cos(0.6), sa = Math.sin(0.6);
    var y2 = y * ca - z * sa, z2 = y * sa + z * ca;
    pos[i * 3] = x; pos[i * 3 + 1] = y2; pos[i * 3 + 2] = z2;
    var t = Math.random();
    if (t > 0.93) c.setHSL(0.09, 0.35, 0.88);
    else if (t > 0.80) c.setHSL(0.58, 0.30, 0.86);
    else c.setHSL(0.58, 0.06, 0.55 + Math.random() * 0.4);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    siz[i] = band ? 0.7 + Math.random() * 0.9 : 0.6 + Math.pow(Math.random(), 3) * 3.4;
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aCol', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
  var m = new THREE.ShaderMaterial({
    uniforms: { uPixel: { value: 1 } },
    vertexShader: [
      'attribute vec3 aCol;',
      'attribute float aSize;',
      'uniform float uPixel;',
      'varying vec3 vCol;',
      'varying float vS;',
      'void main(){',
      '  vCol = aCol; vS = aSize;',
      '  vec4 mv = modelViewMatrix * vec4(position,1.0);',
      '  gl_Position = projectionMatrix * mv;',
      '  gl_PointSize = aSize * uPixel;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying vec3 vCol;',
      'varying float vS;',
      'void main(){',
      '  vec2 d = gl_PointCoord - 0.5;',
      '  float r = length(d) * 2.0;',
      '  float a = 1.0 - smoothstep(0.15, 1.0, r);',
      '  if(a <= 0.01) discard;',
      '  gl_FragColor = vec4(vCol * (0.55 + 0.9 * a), a);',
      '}'
    ].join('\n'),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  var pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  scene.add(pts);
  window.__starMat = m;
})();

/* ------------------------------------------------------------------ *
 *  the sun
 * ------------------------------------------------------------------ */
var sunGroup = new THREE.Group();
scene.add(sunGroup);
var SUN_R = 1.55;
(function buildSun() {
  var geo = new THREE.SphereGeometry(SUN_R, 64, 48);
  var mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: 'varying vec3 vN; varying vec3 vP; void main(){ vN = normalize(normal); vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: [
      'precision highp float;',
      'varying vec3 vN; varying vec3 vP;',
      'uniform float uTime;',
      'float h(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }',
      'float n3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);',
      '  return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),',
      '             mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z); }',
      'void main(){',
      '  vec3 p = normalize(vP);',
      '  float g = n3(p*9.0 + vec3(0.0, uTime*0.05, 0.0))*0.6 + n3(p*22.0 - vec3(uTime*0.08))*0.4;',
      '  float limb = pow(max(dot(normalize(vN), vec3(0.0,0.0,1.0)), 0.0), 0.55);',
      '  vec3 c = mix(vec3(1.0,0.62,0.20), vec3(1.0,0.94,0.72), g);',
      '  c = mix(c, vec3(1.0,1.0,0.94), pow(g,3.0)*0.7);',
      '  gl_FragColor = vec4(c * (0.82 + 0.28*limb), 1.0);',
      '}'
    ].join('\n')
  });
  var sun = new THREE.Mesh(geo, mat);
  sunGroup.add(sun);
  window.__sunMat = mat;

  /* corona billboards */
  function coronaTex(inner, outer) {
    var c = document.createElement('canvas');
    c.width = c.height = 256;
    var x = c.getContext('2d');
    var g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
    g.addColorStop(0, 'rgba(255,244,214,0.85)');
    g.addColorStop(0.10, 'rgba(255,226,170,0.55)');
    g.addColorStop(0.26, 'rgba(255,186,100,0.24)');
    g.addColorStop(0.52, 'rgba(255,146,62,0.09)');
    g.addColorStop(0.78, 'rgba(255,120,40,0.025)');
    g.addColorStop(1, 'rgba(255,120,40,0)');
    x.fillStyle = g; x.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  }
  var halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: coronaTex(), color: 0xffffff, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false
  }));
  halo.scale.setScalar(SUN_R * 7.5);
  halo.renderOrder = 5;
  sunGroup.add(halo);
  var halo2 = new THREE.Sprite(new THREE.SpriteMaterial({
    map: coronaTex(), color: 0xffe6c0, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, opacity: 0.45
  }));
  halo2.scale.setScalar(SUN_R * 17);
  halo2.renderOrder = 4;
  sunGroup.add(halo2);
  window.__halo = halo;
})();

/* ------------------------------------------------------------------ *
 *  pointer / camera input
 * ------------------------------------------------------------------ */
var pointer = { down: false, x: 0, y: 0, moved: 0, id: -1 };
var pointers = new Map();
var pinchStart = 0, pinchDist0 = 0;

function ndcFrom(e) {
  var r = canvas.getBoundingClientRect();
  return { x: ((e.clientX - r.left) / r.width) * 2 - 1, y: -((e.clientY - r.top) / r.height) * 2 + 1 };
}

canvas.addEventListener('pointerdown', function (e) {
  try { canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); } catch (err) {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    pointer.down = true; pointer.x = e.clientX; pointer.y = e.clientY; pointer.moved = 0; pointer.id = e.pointerId;
    canvas.classList.add('dragging');
    cam.autoSpin = false;
  } else if (pointers.size === 2) {
    var a = Array.from(pointers.values());
    pinchDist0 = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    pinchStart = cam.tDist;
  }
});

canvas.addEventListener('pointermove', function (e) {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    var a = Array.from(pointers.values());
    var d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    if (pinchDist0 > 0) cam.tDist = clamp(pinchStart * (pinchDist0 / Math.max(1, d)), 1.2, 1400);
    return;
  }
  if (!pointer.down) return;
  var dx = e.clientX - pointer.x, dy = e.clientY - pointer.y;
  pointer.x = e.clientX; pointer.y = e.clientY;
  pointer.moved += Math.abs(dx) + Math.abs(dy);
  cam.yaw -= dx * 0.0052;
  cam.pitch = clamp(cam.pitch + dy * 0.0042, -1.46, 1.46);
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    canvas.classList.remove('dragging');
    if (pointer.down && pointer.moved < 6) pickAt(e.clientX, e.clientY);
    pointer.down = false;
  }
  if (pointers.size < 2) pinchDist0 = 0;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  cam.tDist = clamp(cam.tDist * Math.exp(e.deltaY * 0.0011), 1.2, 1400);
}, { passive: false });

      'void main(){',
      '  float t = clamp((vR - uInner) / (uOuter - uInner), 0.0, 1.0);',

    _proj.copy(pl.worldPos).project(camera);

    var dist = camera.position.distanceTo(pl.worldPos);
    var px = (_proj.x * 0.5 + 0.5) * w;

    var off = Math.max(8, Math.min(rPix + 12, 60));
    if (behind || px < -100 || px > w + 100 || py < -60 || py > h + 60) {
      el.style.opacity = '0';
      el.style.pointerEvents = 'none';
      continue;
    }
    var ly = py + off, tries = 0, clash = true;

      for (var k = 0; k < placed.length; k++) {
        if (Math.abs(px - placed[k].x) < 82 && Math.abs(ly - placed[k].y) < 15) { ly += 17; clash = true; break; }

    if (clash) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; continue; }

/* ==================================================================== *
 *  main loop
 * ==================================================================== */
var clock = new THREE.Clock();
var elapsed = 0;
var tmpV = new THREE.Vector3();

function update(dt) {
  elapsed += dt;
  var t = elapsed;

  if (time.playing) time.days += dt * time.rate;
  var dDays = dt * time.rate;

  var vis = lerp(1, 0.00125, time.scaleT);
  for (var pi = 0; pi < PLANETS.length; pi++) PLANETS[pi].sizer.scale.setScalar(vis);

  /* scale transition */
  if (time.scaleT !== time.scaleTarget) {
    time.scaleT = damp(time.scaleT, time.scaleTarget, 4.5, dt);
    if (Math.abs(time.scaleT - time.scaleTarget) < 0.002) time.scaleT = time.scaleTarget;
    time.dirty = true;
  }
  if (time.dirty) {
    rebuildOrbits(time.scaleT);
    rebuildBelt(time.scaleT);
    time.dirty = false;
  }

  /* planets */
  for (var i = 0; i < PLANETS.length; i++) {
    var pl = PLANETS[i];
    keplerPosition(pl, time.days, tmpV);
    applyScale(tmpV, time.scaleT, pl.worldPos);
    pl.group.position.copy(pl.worldPos);
    pl.spinAngle += TAU * dDays / pl.spin;
    pl.mesh.rotation.y = pl.spinAngle;
    pl.mat.uniforms.uTime.value = t;
    if (pl.ring) {
      pl.ring.updateWorldMatrix(true, false);
      pl.ringMat.uniforms.uSunLocal.value.set(0, 0, 0);
      pl.ring.worldToLocal(pl.ringMat.uniforms.uSunLocal.value);
      pl.ringMat.uniforms.uPlanetR.value = pl.radius;
    }
  }

  /* moons */
  for (var m = 0; m < MOONS.length; m++) {
    var mo = MOONS[m];
    mo.angle += TAU * dDays / mo.period;
    mo.mesh.position.set(Math.cos(mo.angle) * mo.r, 0, Math.sin(mo.angle) * mo.r);
  }

  /* comet */
  cometDays(time.days);
  applyScale(_v3, time.scaleT, comet.group.position);
  comet.group.scale.setScalar(lerp(1, 1, time.scaleT));
  comet.tail.lookAt(comet.group.position.x * 2, comet.group.position.y * 2, comet.group.position.z * 2);
  comet.tail.material.uniforms.uLen.value = 1.8 + 1.2 * Math.sin(t * 0.7);

  /* belt drift */
  belt.group.rotation.y = time.days * 0.0016;

  /* sun */
  sunGroup.rotation.y += dt * 0.02;
  if (window.__sunMat) window.__sunMat.uniforms.uTime.value = t;
  if (window.__halo) window.__halo.material.opacity = 0.9 + 0.1 * Math.sin(t * 0.8);

  /* camera */
  if (cam.focus) {
    cam.tTgt.copy(cam.focus.worldPos);
  } else {
    cam.tTgt.set(0, 0, 0);
  }
  updateCamera(dt);
  updateLabels();

  /* hud */
  dateEl.textContent = fmtDate(time.days);
  railFill.style.width = (rateToSlider(time.rate) * 100).toFixed(2) + '%';
  updateAudio(dt);
}

function frame() {
  requestAnimationFrame(frame);
  window.__OS_FRAME = (window.__OS_FRAME || 0) + 1;
  var dt = Math.min(clock.getDelta(), 0.06);
  update(dt);
  renderer.render(scene, camera);
}

/* ==================================================================== *
 *  boot
 * ==================================================================== */
window.__OS = {
  time: time, cam: cam, planets: PLANETS, scene: scene, camera: camera, sun: sunGroup, rend: renderer, focus: function (n) {
    focusPlanet(PLANETS.filter(function (p) { return p.key === n; })[0] || null);
  },
  setRate: setRate
};

setRate(1);
time.days = nowDays();
rebuildOrbits(0);
rebuildBelt(0);
resize();
frame();
var hint = document.getElementById('hint');
if (hint) { hint.classList.add('show'); setTimeout(function () { hint.classList.remove('show'); }, 8000); }
})();

/*@@END@@*/
</script>
</body>
